<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        /* transparent background-color，for OBS */
        body {
            background-color: transparent;
            margin: 0;
            padding: 5px;
            font-family: 'Arial', 'Impact', sans-serif;
            color: white;
            text-shadow: 2px 2px 4px black;
            white-space: nowrap;
        }

        .display {
            display: flex;
            align-items: baseline;
        }

        .value {
            font-size: 18px;
            font-weight: 900;
            margin-right: 8px;
            transition: color 0.2s ease;
        }

        .unit {
            font-size: 15px;
            color: #ffffff;
        }

        /* offline：red */
        .offline .value {
            color: #ff6666;
        }

        /* measuring：yellow */
        .measuring .value {
            color: yellow;
        }

        /* Color Grading – Applied when values ​​are within the normal range */
        .color-orange .value {
            color: #ff9900;  /* orange */
        }
        .color-white .value {
            color: white;     /* white */
        }
        .color-green .value {
            color: #33ff33;   /* green */
        }
    </style>
</head>
<body>
    <div class="display" id="display">
        <span id="bitrate-value" class="value">--</span>
        <span id="unit" class="unit">kb/s</span>
    </div>

    <script>
        // ========= User Settings Area =========
        const SRT_API_URL = 'http://localhost:9997/v3/srtconns/list';
        const RTMP_API_URL = 'http://localhost:9997/v3/rtmpconns/list';

        // Unit setting: 'kb/s' or 'Mbps' (independent of each other)
        const SRT_UNIT = 'Mbps';      // SRT Display unit
        const RTMP_UNIT = 'Mbps';     // RTMP Display unit

        // Priority order: true = SRT prioritized, false = RTMP prioritized
        const PREFER_SRT = true;
        // ================================

        // ---------- RTMP-specific computational state ----------
        let rtmpLastBytes = 0;
        let rtmpLastTime = Date.now();

        // ---------- Current Agreement Status ----------
        let srtActive = false;
        let srtBitrateKbps = 0;

        let rtmpActive = false;
        let rtmpBitrateKbps = 0;        // Valid only when active and the calculation is complete

        // ---------- Formatting function ----------
        function formatBitrate(valueKbps, unit) {
            if (unit === 'Mbps') {
                return (valueKbps / 1000).toFixed(2);  // Two decimal places
            } else {
                return Math.round(valueKbps).toString();
            }
        }

        // ---------- Determine the color category based on the bitrate (kb/s) ----------
        function getColorClassFromKbps(kbps) {
            if (kbps < 1000) {
                return 'color-orange';
            } else if (kbps < 2000) {
                return 'color-white';
            } else {
                return 'color-green';
            }
        }

        // ---------- Update SRT status ----------
        async function updateSRT() {
            try {
                const resp = await fetch(SRT_API_URL);
                const data = await resp.json();

                const conn = data.items.find(c => c.state === 'publish');
                if (conn) {
                    srtActive = true;
                    srtBitrateKbps = conn.mbpsReceiveRate * 1000;  // Convert to kb/s
                } else {
                    srtActive = false;
                }
            } catch (e) {
                console.error('SRT API 錯誤', e);
                srtActive = false;
            }
        }

        // ---------- Update RTMP status (calculated per second)----------
        async function updateRTMP() {
            try {
                const resp = await fetch(RTMP_API_URL);
                const data = await resp.json();

                const conn = data.items.find(c => c.state === 'publish');
                if (conn) {
                    const now = Date.now();
                    const bytes = conn.bytesReceived;

                    if (rtmpLastBytes > 0) {
                        const deltaBytes = bytes - rtmpLastBytes;
                        const deltaSec = (now - rtmpLastTime) / 1000;

                        if (deltaSec > 0 && deltaBytes >= 0) {
                            rtmpBitrateKbps = (deltaBytes * 8 / 1000) / deltaSec;
                            rtmpActive = true;
                        } else {
                            rtmpActive = false;
                        }
                    } else {
                        rtmpActive = false;   // This is the first time receiving the data; it is not yet possible to perform calculations.
                    }

                    rtmpLastBytes = bytes;
                    rtmpLastTime = now;
                } else {
                    rtmpActive = false;
                    rtmpLastBytes = 0;
                }
            } catch (e) {
                console.error('RTMP API error', e);
                rtmpActive = false;
                rtmpLastBytes = 0;
            }
        }

        // ---------- Update display based on priority (no protocol tags)----------
        function updateDisplay() {
            const valueSpan = document.getElementById('bitrate-value');
            const unitSpan = document.getElementById('unit');
            const container = document.getElementById('display');

            // Remove all status categories (including color-coded categories)
            container.classList.remove('offline', 'measuring', 'color-orange', 'color-white', 'color-green');

            // Decide which protocol's data to display
            let showSRT = false;
            let showRTMP = false;

            if (PREFER_SRT) {
                if (srtActive) {
                    showSRT = true;
                } else if (rtmpActive) {
                    showRTMP = true;
                }
            } else {
                if (rtmpActive) {
                    showRTMP = true;
                } else if (srtActive) {
                    showSRT = true;
                }
            }

            // Update values ​​and units
            if (showSRT) {
                const displayValue = formatBitrate(srtBitrateKbps, SRT_UNIT);
                valueSpan.innerText = displayValue;
                unitSpan.innerText = SRT_UNIT;

                // Based on the actual bitrate, with color grading applied.
                const colorClass = getColorClassFromKbps(srtBitrateKbps);
                container.classList.add(colorClass);
            }
            else if (showRTMP) {
                if (rtmpBitrateKbps > 0) {
                    const displayValue = formatBitrate(rtmpBitrateKbps, RTMP_UNIT);
                    valueSpan.innerText = displayValue;
                    unitSpan.innerText = RTMP_UNIT;

                    // Based on the actual bitrate, with color grading applied.
                    const colorClass = getColorClassFromKbps(rtmpBitrateKbps);
                    container.classList.add(colorClass);
                } else {
                    valueSpan.innerText = 'measuring';
                    unitSpan.innerText = '';
                    container.classList.add('measuring'); // yellow
                }
            }
            else {
                // Both offline
                valueSpan.innerText = 'offline';
                unitSpan.innerText = '';
                container.classList.add('offline'); // red
            }
        }

        // ---------- Main loop ----------
        async function refreshAll() {
            await Promise.all([updateSRT(), updateRTMP()]);
            updateDisplay();
        }

        refreshAll();
        setInterval(refreshAll, 1000);
    </script>
</body>
</html>
